name: detection-validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-as-code:
    name: Detection-as-Code Continuous Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run full regression test suite
        run: python -m unittest discover -s tests -v

      - name: Zero-false-positive validation gate
        run: python -m tools.swarm.validate_gate

      - name: Export MITRE ATT&CK Navigator coverage layer
        run: python -m tools.swarm.export_layer

      - name: Upload ATT&CK Navigator layer artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-navigator-layer
          path: docs/swarm/results/layer.json
          if-no-files-found: warn
