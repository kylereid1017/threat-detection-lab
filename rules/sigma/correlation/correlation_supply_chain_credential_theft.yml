title: Correlated Package Hook Execution and Developer Credential Scraping
id: 6a5b4c3d-2e1f-4a0b-9c8d-7e6f5d4c3b2a
status: experimental
description: >
    Correlates a package manager lifecycle hook spawning an interpreter with developer credential
    access by the same user within 180 seconds. Neither stage is conclusive alone. Packages compile
    native modules during install, and credential paths are read by legitimate tooling constantly.
    The install-then-harvest ordering within a short window is the discriminator, and it is the
    reason this correlation exists rather than raising either component rule's severity.

    Revision note: an earlier version declared temporal_ordered while referencing a single component
    rule. An ordered correlation over one stage cannot express an ordering, so the rule asserted a
    sequence it never evaluated.
author: Kyle Reid
date: 2026-09-05
correlation:
    type: temporal_ordered
    rules:
        - macos_package_hook_execution
        - macos_dev_credential_access
    group-by:
        - User
    timespan: 180s
tags:
    - attack.initial_access
    - attack.t1195.001
    - attack.credential_access
    - attack.t1552.001
level: critical
telemetry_prerequisites:
    channel: macOS ESF or Linux Auditd, both stages from the same sensor
    event_id: ES_EVENT_TYPE_NOTIFY_EXEC for both component rules
    audit_policy: >-
        Process creation with command-line arguments and parent lineage. Both component rules read
        the same channel, so this correlation has no cross-source field mapping requirement.
    required_fields:
        - Image
        - CommandLine
        - ParentImage
        - User
    degradation_mode: >-
        The 180 second window is an assumption, not a measurement. A harvester that sleeps past the
        window defeats the correlation while both component rules still fire independently at their
        own severities. Widening the window trades detection of slow harvesting against correlating
        unrelated developer activity, and the tradeoff should be measured per environment rather
        than inherited from this file.
