title: Correlated Unpinned Agent Tool Execution and Credential Scraping
name: correlation_agent_unpinned_tool_credential_access
id: a9b8c7d6-1e2f-4a0b-8c7d-6e5f4d3c2b1a
status: experimental
description: >
    Correlates an unpinned dynamic tool execution spawned by an AI agent runtime with immediate
    credential access (such as accessing AWS credentials, SSH keys, or cloud tokens)
    within 180 seconds.
author: Kyle Reid
date: 2026-09-06
correlation:
    type: temporal_ordered
    rules:
        - agent_runtime_unpinned_tool_execution
        - macos_dev_credential_access
    group-by:
        - User
    timespan: 180s
tags:
    - attack.initial_access
    - attack.t1195.001
    - attack.credential_access
    - attack.t1552.001
level: critical
telemetry_prerequisites:
    channel: Sysmon Event ID 1 or macOS ESF
    event_id: Process creation events across both stages
    audit_policy: Process creation with command-line arguments and user context.
    required_fields:
        - Image
        - CommandLine
        - ParentImage
        - User
    degradation_mode: >-
        If user context is unavailable across processes, correlation will fail to bind stages.
