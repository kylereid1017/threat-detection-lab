title: LSASS Process Memory Dump via Rundll32 Comsvcs.dll
id: 7f8a9b0c-1d2e-4f3a-8b9c-0d1e2f3a4b5c
status: experimental
description: Detects execution of rundll32.exe calling comsvcs.dll MiniDump export or ordinal #24 to dump LSASS process memory.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://modexp.wordpress.com/2019/08/30/minidumpwritedump-via-comsvcs-dll/
author: Kyle Reid
date: 2026-09-03
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
telemetry_prerequisites:
    channel: Microsoft-Windows-Sysmon/Operational or Security
    event_id: 1 (Sysmon) or 4688 (Security)
    audit_policy: >-
        Audit Process Creation (Success) with command line logging enabled.
    required_fields:
        - Image
        - CommandLine
    sysmon_configuration: >-
        Requires Sysmon ProcessCreate without exclusion on rundll32.exe.
    degradation_mode: >-
        This rule relies exclusively on command-line string inspection of rundll32.exe invoking comsvcs.dll.
        When adversaries utilize custom or unhooked native dumpers (e.g. mimikatz, nanodump, procdump)
        without invoking comsvcs.dll via rundll32, this analytic suffers total evasion (recall drops to 0%).
        Compensating detection requires Sysmon Event ID 10 (Process Access) monitoring handles to lsass.exe.
detection:
    selection_img:
        Image|endswith:
            - '\rundll32.exe'
    selection_dll:
        CommandLine|contains:
            - 'comsvcs.dll'
            - 'comsvcs'
    selection_method:
        CommandLine|contains:
            - 'MiniDump'
            - 'minidump'
            - '#24'
            - 'MiniDumpW'
    condition: selection_img and selection_dll and selection_method
fields:
    - CommandLine
    - Image
    - User
falsepositives:
    - Extremely rare developer diagnostics; essentially zero in standard enterprise workstation telemetry.
level: critical
