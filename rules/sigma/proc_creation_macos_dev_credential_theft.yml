title: Suspicious Developer Runtime Access to Sensitive Workstation Credentials
name: macos_dev_credential_access
id: 7c3d1f04-9a28-4e17-b732-4d5162a8c901
status: experimental
description: Detects developer runtimes and interpreter processes (Node.js, Python, shell scripts) spawning child processes or executing commands that target sensitive developer workstation credentials, including AWS credentials, SSH private keys, and browser session cookie vaults. Heavily observed in DPRK Famous Chollima / Contagious Interview campaigns targeting AI researchers and software engineers.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-059a
    - https://cloud.google.com/blog/topics/threat-intelligence/dprk-malware-developer-job-hunting
author: Kyle Reid
date: 2026-09-05
tags:
    - attack.credential_access
    - attack.t1552.001
    - attack.t1539
    - attack.execution
    - attack.t1059.006
    - attack.t1059.007
    - attack.initial_access
    - attack.t1195.001
logsource:
    category: process_creation
    product: macos
telemetry_prerequisites:
    channel: Endpoint Security Framework (ESF) / Auditd / SysmonForLinux
    event_id: 1 (ProcessExec) or ES_EVENT_TYPE_NOTIFY_EXEC
    audit_policy: Process Creation Tracking with Full Command-Line Arguments enabled.
    required_fields:
        - Image
        - CommandLine
        - ParentImage
    degradation_mode: If command-line arguments are suppressed, credential targets cannot be distinguished from benign developer tooling.
detection:
    selection_parent:
        ParentImage|endswith:
            - '/node'
            - '/python'
            - '/python3'
            - '/osascript'
            - '/sh'
            - '/bash'
    selection_target:
        CommandLine|contains:
            - '.aws/credentials'
            - '.aws/config'
            - '.ssh/id_rsa'
            - '.ssh/id_ed25519'
            - 'Default/Cookies'
            - 'LaunchAgents'
    condition: selection_parent and selection_target
level: high
